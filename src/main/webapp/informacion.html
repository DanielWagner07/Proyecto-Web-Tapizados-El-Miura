<!DOCTYPE html>
<!--
  Información y contacto (prototipo 6, RF09 / CU09).
  Todos los textos se editan desde el panel (Información del negocio) y llegan
  con GET /api/informacion y GET /api/servicios (js/informacion.js).
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información y contacto | Tapizados El Miura</title>
    <meta name="description" content="Dirección, horario, teléfono, WhatsApp, cobertura y garantía de Tapizados El Miura en Caucasia, Antioquia.">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/informacion.css">
    <script type="module" src="js/informacion.js"></script>
</head>
<body data-pagina="informacion">
<a class="saltar" href="#contenido">Ir al contenido</a>
<header id="encabezado" class="encabezado"></header>

<main id="contenido">
    <div class="contenedor">
        <nav class="migas" aria-label="Ubicación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li aria-current="page">Información</li>
            </ol>
        </nav>
    </div>

    <!-- Quiénes somos y contacto -->
    <section class="contenedor nosotros" aria-labelledby="titulo-nosotros">
        <div class="nosotros__texto">
            <h1 id="titulo-nosotros">Tapizados El Miura</h1>
            <p class="nosotros__lema">Taller de tapicería, restauración y fabricación de muebles.</p>
            <div id="trayectoria" class="nosotros__trayectoria">
                <div class="esqueleto esqueleto--linea"></div>
                <div class="esqueleto esqueleto--linea"></div>
            </div>
        </div>
        <aside class="tarjeta-contacto" aria-labelledby="titulo-contacto">
            <h2 id="titulo-contacto">Contáctanos</h2>
            <div id="boton-whatsapp"></div>
            <ul class="tarjeta-contacto__datos" id="contacto"></ul>
        </aside>
    </section>

    <!-- Servicios -->
    <section class="seccion seccion--suave" aria-labelledby="titulo-servicios">
        <div class="contenedor">
            <h2 id="titulo-servicios">Lo que hacemos en el taller</h2>
            <ul class="lista-servicios" id="servicios"></ul>
        </div>
    </section>

    <!-- Cobertura y garantía -->
    <section class="seccion" aria-label="Cobertura y garantía">
        <div class="contenedor politicas" id="politicas"></div>
    </section>

    <!-- Redes -->
    <section class="contenedor redes" id="seccion-redes" aria-labelledby="titulo-redes" hidden>
        <h2 id="titulo-redes">Síguenos</h2>
        <p class="texto-secundario">Publicamos los trabajos recién terminados en nuestras redes.</p>
        <div class="redes__lista" id="redes"></div>
    </section>
</main>

<footer id="pie" class="pie"></footer>
<div id="avisos" class="avisos" aria-live="polite"></div>
<noscript><p class="contenedor">Para ver la información active JavaScript en su navegador.</p></noscript>
</body>
</html>
