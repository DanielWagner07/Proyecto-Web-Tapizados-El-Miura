<!DOCTYPE html>
<!--
  Catálogo de productos (prototipo 2, RF01 / CU02).
  Admite en la dirección ?categoria=<id> y ?q=<texto>. Los filtros se arman con
  los valores reales de la ficha técnica (js/muebles.js).
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebles | Tapizados El Miura</title>
    <meta name="description" content="Catálogo de sofás, comedores, mecedoras, juegos de sala y mesas de centro de Tapizados El Miura.">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/muebles.css">
    <script type="module" src="js/muebles.js"></script>
</head>
<body data-pagina="muebles">
<a class="saltar" href="#contenido">Ir al contenido</a>
<header id="encabezado" class="encabezado"></header>

<main id="contenido" class="contenedor">
    <nav class="migas" aria-label="Ubicación">
        <ol id="migas">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="muebles.html">Muebles</a></li>
        </ol>
    </nav>

    <div class="titulo-pagina">
        <h1 id="titulo">Muebles</h1>
        <span class="titulo-pagina__conteo" id="conteo"></span>
    </div>
    <p class="catalogo__descripcion texto-secundario" id="descripcion">
        Muebles fabricados en nuestro taller. Agrega los que te interesan al carrito y envía tu cotización por WhatsApp.
    </p>

    <div class="catalogo">
        <!-- Filtros (en celular se abren con el botón "Filtros") -->
        <aside class="filtros" id="filtros" aria-labelledby="titulo-filtros">
            <div class="filtros__cabecera">
                <h2 id="titulo-filtros">Filtros</h2>
                <button type="button" class="icono-boton filtros__cerrar" id="cerrar-filtros" aria-label="Cerrar filtros">
                    <span aria-hidden="true">✕</span>
                </button>
            </div>
            <div id="formulario-filtros" class="filtros__grupos"></div>
            <div class="filtros__pie">
                <button type="button" class="boton boton--texto" id="limpiar-filtros">Limpiar filtros</button>
                <button type="button" class="boton boton--principal filtros__ver" id="ver-resultados">Ver productos</button>
            </div>
        </aside>

        <section class="catalogo__resultados" aria-labelledby="titulo">
            <div class="barra-catalogo">
                <button type="button" class="boton boton--contorno barra-catalogo__filtros" id="abrir-filtros" aria-controls="filtros" aria-expanded="false">
                    Filtros <span id="filtros-activos"></span>
                </button>
                <p class="barra-catalogo__busqueda" id="busqueda-activa" hidden></p>
                <label class="ordenar">
                    <span>Ordenar por</span>
                    <select id="orden">
                        <option value="recomendados">Disponibles primero</option>
                        <option value="precio-menor">Menor precio</option>
                        <option value="precio-mayor">Mayor precio</option>
                        <option value="nombre">Nombre (A-Z)</option>
                    </select>
                </label>
            </div>
            <div class="rejilla-productos" id="productos" aria-live="polite"></div>
        </section>
    </div>
</main>

<footer id="pie" class="pie"></footer>
<div id="avisos" class="avisos" aria-live="polite"></div>
<noscript><p class="contenedor">Para ver el catálogo active JavaScript en su navegador.</p></noscript>
</body>
</html>
